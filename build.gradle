plugins {
    id 'java'
    id 'com.google.protobuf' version '0.9.4'
    id 'application'
}

repositories {
    mavenCentral()
}

def grpcVersion = '1.65.1'
def protobufVersion = '3.25.5'
def nettyTcNativeVersion = '2.0.65.Final'

dependencies {
    implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation "com.google.protobuf:protobuf-java:${protobufVersion}"
    implementation 'com.google.guava:guava:33.3.1-jre'

    // For TLS on Windows without OpenSSL
    runtimeOnly "io.netty:netty-tcnative-boringssl-static:${nettyTcNativeVersion}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
}

protobuf {
    protoc { artifact = "com.google.protobuf:protoc:${protobufVersion}" }
    plugins {
        grpc { artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}" }
    }
    generateProtoTasks {
        all().each { task ->
            task.plugins { grpc {} }
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    // Default main; can be overridden with -PmainClass=...
    mainClass = (project.findProperty('mainClass') ?: 'com.example.distributedprinting.server.PrinterServer') as String
}

tasks.test {
    useJUnitPlatform()
}
